<title>Foundry Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Single committed look: a dark control-room HUD over the game view. */
  :root {
    color-scheme: dark;
    --ink: #ede8df;
    --ink-dim: #a9aca9;
    --steel: #121518;
    --steel-2: #1b2024;
    --line: rgba(237, 232, 223, 0.16);
    --hazard: #f2b01e;
    --hazard-ink: #1d1d1b;
    --signal: #e5483b;
    --team: #ff6b1a;
    --ok: #7fd18b;
    --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: #0e1113; color: var(--ink); font-family: var(--mono); overflow: hidden; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  /* ---------------------------------------------------------------- main menu */
  #menu { position: fixed; inset: 0; z-index: 5; display: none; overflow: hidden; }
  body[data-state="menu"] #menu { display: block; }
  .m-vignette { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(10,12,14,0.92) 0%, rgba(10,12,14,0.72) 34%, rgba(10,12,14,0.15) 62%, rgba(10,12,14,0.55) 100%),
      linear-gradient(0deg, rgba(10,12,14,0.85), transparent 22%); }
  .m-vignette::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 12px;
    background: repeating-linear-gradient(-45deg, var(--hazard) 0 12px, var(--hazard-ink) 12px 24px); }
  .m-shell { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 620px); gap: clamp(20px, 4vw, 64px);
    padding: clamp(24px, 5vh, 56px) clamp(16px, 4vw, 64px) 84px calc(clamp(16px, 4vw, 64px) + 12px); overflow-y: auto; align-content: start; }
  .m-left { display: grid; gap: 28px; align-content: start; }
  .m-eyebrow { display: flex; align-items: center; gap: 10px; font: 500 11.5px/1 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--hazard); }
  .m-eyebrow i { width: 8px; height: 8px; background: var(--ok); box-shadow: 0 0 10px var(--ok); border-radius: 50%; animation: blink 2.4s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .m-logo { margin: 12px 0 6px; font: 800 clamp(52px, 6.2vw, 92px)/0.8 var(--display); text-transform: uppercase; letter-spacing: 0.005em; display: grid; }
  .m-logo span { display: block; animation: slidein 700ms cubic-bezier(.2,.8,.2,1) both; }
  .m-logo .l2 { color: var(--hazard); animation-delay: 90ms; -webkit-text-stroke: 0; }
  @keyframes slidein { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  .m-tag { margin: 6px 0 0; font: 500 13px/1.4 var(--mono); color: var(--ink-dim); letter-spacing: 0.06em; }
  .m-nav { display: grid; gap: 6px; }
  .m-item { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 12px; text-align: left; cursor: pointer;
    background: rgba(18,21,24,0.55); border: 1px solid transparent; border-left: 3px solid rgba(237,232,223,0.18); color: var(--ink);
    padding: 12px 16px 11px 16px; font-family: var(--mono); overflow: hidden; transition: background 140ms, border-color 140ms, transform 140ms;
  }
  .m-nav.intro .m-item { animation: slidein 500ms cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 45ms + 150ms); }
  .m-item b { font: 700 24px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
  .m-item small { font-size: 11px; color: var(--ink-dim); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  .m-item::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, rgba(242,176,30,0.12) 0 8px, transparent 8px 16px); transform: translateX(-102%); transition: transform 220ms ease; }
  .m-item:hover { background: rgba(27,32,36,0.9); border-left-color: var(--hazard); transform: translateX(4px); }
  .m-item:hover::before { transform: none; }
  .m-item.on { border-left-color: var(--hazard); background: rgba(27,32,36,0.95); }
  .m-item.primary { background: var(--hazard); color: var(--hazard-ink); border-left-color: var(--hazard-ink); }
  .m-item.primary small { color: rgba(29,29,27,0.72); }
  .m-item.primary:hover { filter: brightness(1.06); }
  .m-item:focus-visible, .m-btn:focus-visible, .sw:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .m-right { display: grid; gap: 14px; align-content: start; min-width: 0; }
  .m-right.enter > * { animation: rise 380ms cubic-bezier(.2,.8,.2,1) both; }
  .m-right[data-screen="profile"] { max-width: 420px; }
  .m-right.enter > *:nth-child(2) { animation-delay: 60ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .m-card { position: relative; background: linear-gradient(180deg, rgba(27,32,36,0.93), rgba(16,19,22,0.95)); border: 1px solid var(--line); padding: 22px 24px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); min-width: 0; }
  .m-card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 10px, var(--hazard-ink) 10px 20px); }
  .m-kicker { font: 500 11px/1 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--hazard); margin-bottom: 10px; }
  .m-h2 { margin: 0 0 12px; font: 700 34px/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
  .m-p { margin: 0 0 12px; font-size: 13px; line-height: 1.6; color: var(--ink-dim); max-width: 60ch; }
  .m-p b { color: var(--ink); font-weight: 500; }
  .m-note { margin: 12px 0 0; font-size: 11.5px; line-height: 1.55; color: var(--ink-dim); }
  .m-note code, .m-p code, .m-steps code { color: var(--hazard); font-family: var(--mono); }
  .m-steps { margin: 4px 0 8px; padding-left: 20px; font-size: 13px; line-height: 1.8; color: var(--ink); }
  .m-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .m-btn { font: 600 13px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: rgba(237,232,223,0.06); border: 1px solid var(--line); padding: 11px 16px; cursor: pointer; transition: background 120ms, transform 120ms; }
  .m-btn:hover { background: rgba(237,232,223,0.14); }
  .m-btn.primary { background: var(--hazard); color: var(--hazard-ink); border-color: var(--hazard); }
  .m-btn.primary:hover { filter: brightness(1.07); transform: translateX(2px); }
  .m-btn.big { font: 700 22px/1 var(--display); letter-spacing: 0.1em; padding: 14px 34px 13px; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); }
  .m-btn.ghost { background: transparent; }
  .m-btn.danger { color: #fff; background: var(--signal); border-color: var(--signal); }
  .m-link { margin-top: 10px; background: none; border: 0; padding: 0; color: var(--hazard); font: 500 12px/1 var(--mono); cursor: pointer; letter-spacing: 0.04em; }
  .m-msg { padding: 12px 14px; background: rgba(18,21,24,0.92); border-left: 3px solid var(--ok); font-size: 13px; }
  .m-msg.warn { border-left-color: var(--signal); }
  .news-mini ul, .news ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 12.5px; line-height: 1.5; color: var(--ink-dim); }
  .news article { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .news article:last-child { border-bottom: 0; }
  .news header { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
  .news header b { font: 700 20px/1 var(--display); color: var(--hazard); text-transform: uppercase; }
  .news header span { font: 600 16px/1 var(--display); text-transform: uppercase; }
  .news header small { margin-left: auto; color: var(--ink-dim); font-size: 11px; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .slots.mini { grid-template-columns: 1fr; }
  .slot-card { position: relative; display: grid; gap: 12px; background: rgba(8,10,12,0.5); border: 1px solid var(--line); border-top: 3px solid var(--c, var(--hazard)); padding: 14px; text-align: left; color: var(--ink); font-family: var(--mono); }
  .slot-card.big { background: rgba(8,10,12,0.35); }
  .slot-card.add { place-content: center; justify-items: center; min-height: 170px; cursor: pointer; border-style: dashed; border-top-style: dashed; border-top-color: var(--line); gap: 6px; background: transparent; }
  .slot-card.add b { font: 700 42px/1 var(--display); color: var(--hazard); }
  .slot-card.add span { font: 700 18px/1 var(--display); text-transform: uppercase; letter-spacing: 0.06em; }
  .slot-card.add small { color: var(--ink-dim); font-size: 11px; }
  .slot-card.add:hover { background: rgba(242,176,30,0.08); }
  .sc-top { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .sc-lv { flex: none; font: 700 13px/1 var(--display); letter-spacing: 0.08em; padding: 4px 7px 3px; background: var(--c, var(--hazard)); color: #111; }
  .sc-name { font: 700 22px/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-card.big .sc-name { font-size: 30px; }
  .sc-stats { display: grid; grid-template-columns: repeat(4, auto); gap: 8px 16px; margin: 0; }
  .slots:not(.mini) .sc-stats { grid-template-columns: repeat(2, auto); }
  .sc-stats dt { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
  .sc-stats dd { margin: 3px 0 0; font: 600 18px/1 var(--display); font-variant-numeric: tabular-nums; }
  .sc-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sc-foot small { flex: 1 1 100%; font-size: 11px; color: var(--ink-dim); }
  .m-field { display: grid; gap: 8px; margin: 12px 0; }
  .m-field > span { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
  .m-field input { font: 600 20px/1 var(--display); letter-spacing: 0.04em; color: var(--ink); background: rgba(8,10,12,0.6); border: 1px solid var(--line); border-bottom: 2px solid var(--hazard); padding: 10px 12px; width: 100%; max-width: 420px; box-sizing: border-box; outline: none; }
  .m-field input:focus { border-color: var(--hazard); }
  .code-in { font-size: 34px !important; letter-spacing: 0.4em !important; max-width: 220px !important; text-align: center; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw { width: 34px; height: 34px; border: 2px solid rgba(0,0,0,0.4); background: var(--c); cursor: pointer; clip-path: polygon(0 0, 100% 0, 100% 70%, 70% 100%, 0 100%); }
  .sw.on { outline: 2px solid var(--ink); outline-offset: 2px; }
  .swatches.sm .sw { width: 24px; height: 24px; }
  .coop-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .coop-cols section + section { border-left: 1px dashed var(--line); padding-left: 24px; }
  .m-tabs { display: flex; gap: 4px; margin: 4px 0 14px; flex-wrap: wrap; }
  .m-tabs button, .seg button { font: 600 11.5px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; }
  .m-tabs button.on, .seg button.on { background: var(--hazard); color: var(--hazard-ink); border-color: var(--hazard); }
  .m-set { display: grid; gap: 4px; }
  .m-range, .m-toggle, .m-choice { display: grid; grid-template-columns: 180px 1fr 70px; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; color: var(--ink); text-align: left; }
  .m-range output { font: 600 16px/1 var(--display); text-align: right; font-variant-numeric: tabular-nums; }
  .m-range input { width: 100%; accent-color: var(--hazard); }
  .m-toggle { grid-template-columns: 1fr auto; background: none; border-left: 0; border-right: 0; border-top: 0; cursor: pointer; font-family: var(--mono); }
  .m-toggle i { width: 40px; height: 20px; background: rgba(237,232,223,0.15); position: relative; }
  .m-toggle i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; background: var(--ink-dim); transition: transform 150ms, background 150ms; }
  .m-toggle.on i { background: rgba(127,209,139,0.35); }
  .m-toggle.on i::after { transform: translateX(20px); background: var(--ok); }
  .m-choice { grid-template-columns: 180px 1fr; }
  .keys-list { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; align-items: center; font-size: 12px; margin-top: 14px; color: var(--ink-dim); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .tile { background: rgba(8,10,12,0.5); border: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; }
  .tile small { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
  .tile b { font: 700 26px/1 var(--display); font-variant-numeric: tabular-nums; }
  .m-foot { position: absolute; left: 12px; right: 0; bottom: 0; display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 14px clamp(16px, 4vw, 64px); background: linear-gradient(0deg, rgba(10,12,14,0.9), transparent); flex-wrap: wrap; }
  .m-tip { font-size: 12px; color: var(--ink-dim); opacity: 0; transition: opacity 250ms; max-width: 70ch; }
  .m-tip.show { opacity: 1; }
  .m-tip b { color: var(--hazard); margin-right: 10px; font-weight: 600; letter-spacing: 0.1em; }
  .m-chips { display: flex; gap: 8px; }
  .m-chip { display: inline-flex; gap: 8px; align-items: center; font: 500 11.5px/1 var(--mono); color: var(--ink); background: rgba(18,21,24,0.85); border: 1px solid var(--line); padding: 7px 10px; cursor: default; }
  button.m-chip { cursor: pointer; }
  .m-chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-dim); }
  .m-chip.ok i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  /* pause + overlay */
  #pause { position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; padding: 16px; background: rgba(8,10,12,0.55); overflow-y: auto; }
  #pause[hidden] { display: none; }
  body:not([data-state="paused"]) #pause { display: none; }
  .p-wrap { width: min(560px, 100%); }
  .m-card.pause .p-btns { display: grid; gap: 8px; margin-top: 18px; }
  .m-card.pause .p-btns .m-btn.big { justify-self: start; }
  .invite { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; padding: 14px; margin: 10px 0; background: rgba(8,10,12,0.5); border: 1px dashed var(--hazard); }
  .invite small { grid-column: 1 / -1; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
  .invite b { font: 800 46px/1 var(--display); letter-spacing: 0.3em; color: var(--hazard); }
  .invite .m-note { grid-column: 1 / -1; margin: 4px 0 0; }
  .roster { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .roster li { display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .roster li i { width: 12px; height: 12px; }
  .roster li em { font-style: normal; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--hazard); }
  .roster li.wait { color: var(--ink-dim); font-size: 12px; }
  #overlay { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(8,10,12,0.7); padding: 16px; }
  #overlay[hidden] { display: none; }
  .ov-card { display: grid; gap: 14px; justify-items: center; text-align: center; background: linear-gradient(180deg, rgba(27,32,36,0.97), rgba(16,19,22,0.98)); border: 1px solid var(--line); padding: 28px 32px; font-size: 13px; max-width: 460px; }
  .ov-title { font: 700 32px/1 var(--display); text-transform: uppercase; }
  .ov-sub { color: var(--ink-dim); line-height: 1.6; }
  .ov-sub b { color: var(--hazard); font-weight: 600; }
  .spin { width: 34px; height: 34px; border: 3px solid rgba(237,232,223,0.15); border-top-color: var(--hazard); border-radius: 50%; animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--ink-dim); font: 500 11.5px/1 var(--mono); text-decoration: underline; cursor: pointer; }
  kbd {
    font: 500 11.5px/1 var(--mono); color: var(--ink); background: var(--steel); border: 1px solid var(--line); border-bottom-width: 2px;
    padding: 5px 7px 4px; border-radius: 3px; white-space: nowrap; justify-self: start;
  }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; align-items: center; font-size: 12.5px; }
  #boot-error { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 9; background: var(--signal); color: #fff; padding: 12px 14px; font-size: 13px; }
  @media (max-width: 860px) {
    .m-shell { grid-template-columns: 1fr; padding-bottom: 110px; }
    .m-vignette { background: rgba(10,12,14,0.78); }
    .coop-cols { grid-template-columns: 1fr; }
    .coop-cols section + section { border-left: 0; padding-left: 0; border-top: 1px dashed var(--line); padding-top: 16px; }
    .m-range, .m-choice { grid-template-columns: 1fr; gap: 8px; }
    .sc-stats { grid-template-columns: repeat(2, auto); }
  }
  @media (max-height: 760px) and (min-width: 861px) {
    .m-shell { padding-top: 20px; }
    .m-left { gap: 16px; }
    .m-logo { font-size: clamp(46px, 5vw, 72px); margin-top: 8px; }
    .m-item { padding: 8px 14px 7px; }
    .m-item b { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .m-item, .m-logo span, .m-right.enter > * { animation: none; } }

  /* ---------------------------------------------------------------- HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; display: none; }
  body[data-state="playing"] #hud, body[data-state="paused"] #hud { display: block; }
  .shadow { text-shadow: 0 1px 2px rgba(0,0,0,0.75), 0 0 12px rgba(0,0,0,0.35); }

  #crosshair { --gap: 10px; position: absolute; left: 50%; top: 50%; width: 0; height: 0; transition: opacity 90ms linear; }
  #crosshair i { position: absolute; background: var(--ink); box-shadow: 0 0 0 1px rgba(0,0,0,0.45); }
  #crosshair i:nth-child(1) { width: 2px; height: 8px; left: -1px; top: calc(-1 * var(--gap) - 8px); }
  #crosshair i:nth-child(2) { width: 2px; height: 8px; left: -1px; top: var(--gap); }
  #crosshair i:nth-child(3) { width: 8px; height: 2px; top: -1px; left: calc(-1 * var(--gap) - 8px); }
  #crosshair i:nth-child(4) { width: 8px; height: 2px; top: -1px; left: var(--gap); }
  #crosshair b { position: absolute; left: -1px; top: -1px; width: 2px; height: 2px; background: var(--hazard); }

  #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
  #hitmarker::before, #hitmarker::after {
    content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px;
    background: linear-gradient(var(--ink) 0 34%, transparent 34% 66%, var(--ink) 66%);
  }
  #hitmarker::before { transform: rotate(45deg); } #hitmarker::after { transform: rotate(-45deg); }
  #hitmarker[data-kind="head"]::before, #hitmarker[data-kind="head"]::after { background: linear-gradient(var(--hazard) 0 34%, transparent 34% 66%, var(--hazard) 66%); }
  #hitmarker[data-kind="kill"]::before, #hitmarker[data-kind="kill"]::after { background: linear-gradient(var(--signal) 0 34%, transparent 34% 66%, var(--signal) 66%); }
  #dmgnum { position: absolute; left: calc(50% + 28px); top: calc(50% - 30px); font: 700 18px/1 var(--display); opacity: 0; }
  #dmgnum[data-kind="head"] { color: var(--hazard); } #dmgnum[data-kind="kill"] { color: var(--signal); } #dmgnum[data-kind="plate"] { color: var(--ink-dim); font-size: 14px; }

  .corner { position: absolute; display: grid; gap: 6px; }
  #ammo { right: max(20px, 2.2vw); bottom: max(18px, 2.4vh); justify-items: end; text-align: right; }
  .wname { font: 600 13px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
  .wname em { font-style: normal; color: var(--hazard); margin-left: 8px; }
  .count { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); font-variant-numeric: tabular-nums; }
  #ammo-mag { font-weight: 700; font-size: 64px; line-height: 0.85; min-width: 1.1ch; text-align: right; }
  #ammo-chamber { font: 600 15px/1 var(--mono); padding: 3px 5px; border: 1px solid var(--line); color: var(--ink-dim); opacity: 0.45; }
  #ammo-chamber.on { color: var(--hazard-ink); background: var(--hazard); border-color: var(--hazard); opacity: 1; }
  .reserve { font-weight: 600; font-size: 26px; color: var(--ink-dim); }
  #ammo-pips { display: flex; gap: 3px; }
  #ammo-pips i { width: 5px; height: 14px; background: var(--hazard); transform: skewX(-12deg); box-shadow: 0 0 0 1px rgba(0,0,0,0.35); }
  #ammo-pips i.spent { background: rgba(237,232,223,0.18); }

  #vcursor { position: fixed; left: 0; top: 0; width: 18px; height: 18px; margin: -2px 0 0 -2px; z-index: 8; pointer-events: none; display: none;
